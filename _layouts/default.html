<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    
    <!-- Bootstrap 5 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --sidebar-blue: #3b7dd8;
            --sidebar-dark: #2f69b8;
        }
        .sidebar {
            background-color: var(--sidebar-blue);
        }
        .profile-img {
            width: 130px;
            height: 130px;
            object-fit: cover;
        }
        .social-btn {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #fff;
            text-decoration: none;
            transition: background 0.2s;
        }
        .social-btn:hover {
            background: #fff;
            color: var(--sidebar-blue);
        }
        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 4px;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            color: #fff;
            background-color: var(--sidebar-dark);
        }
    </style>
</head>
<body class="bg-white">

<div class="container-fluid p-0">
    <div class="row g-0 min-vh-100">
        
        <!-- Left Sidebar -->
        <aside class="col-lg-3 col-xl-2 sidebar text-white p-4 d-flex flex-column text-center">
            <h2 class="h4 fw-bold mb-4">
                <a href="{{ '/' | relative_url }}" class="text-white text-decoration-none">{{ site.title }}</a>
            </h2>

            <!-- Avatar & Bio -->
            <div class="mb-4">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80" 
                     alt="Profile" 
                     class="rounded-circle profile-img mb-3 shadow-sm border border-2 border-white">
                <p class="small text-white-50 mb-2">
                    Hi, I'm a software developer writing about modern web tools, system architecture, and tech trends.
                </p>
                <a href="{{ '/about.html' | relative_url }}" class="small text-white text-decoration-underline">Find out more about me</a>
            </div>

            <!-- Social Links -->
            <div class="d-flex justify-content-center gap-2 mb-4">
                <a href="#" class="social-btn"><i class="bi bi-twitter-x"></i></a>
                <a href="#" class="social-btn"><i class="bi bi-linkedin"></i></a>
                <a href="#" class="social-btn"><i class="bi bi-github"></i></a>
                <a href="#" class="social-btn"><i class="bi bi-stack-overflow"></i></a>
            </div>

            <hr class="border-white-50 my-2">

            <!-- Navigation Links -->
            <nav class="nav flex-column gap-1 text-start my-3">
                <a class="nav-link {% if page.url == '/' %}active{% endif %}" href="{{ '/' | relative_url }}">
                    <i class="bi bi-house-door me-2"></i> Blog Home
                </a>
                <a class="nav-link" href="#">
                    <i class="bi bi-bookmark me-2"></i> Featured Posts
                </a>
                <a class="nav-link {% if page.url == '/about.html' %}active{% endif %}" href="{{ '/about.html' | relative_url }}">
                    <i class="bi bi-person me-2"></i> About Me
                </a>
            </nav>

            <!-- Call to Action -->
            <div class="mt-auto pt-3">
                <a href="mailto:you@example.com" class="btn btn-dark w-100 fw-semibold">
                    <i class="bi bi-envelope me-1"></i> Get in Touch
                </a>
            </div>
        </aside>

        <!-- Right Main Content Area -->
        <main class="col-lg-9 col-xl-10 p-4 p-md-5">
            {{ content }}
        </main>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
