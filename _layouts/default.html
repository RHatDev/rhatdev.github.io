<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --theme-blue: #3d7ce5;
            --theme-blue-dark: #295ec0;
        }

        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* Sidebar Styling */
        .sidebar {
            background-color: var(--theme-blue);
        }

        .profile-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.2);
        }

        .social-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #ffffff;
            color: var(--theme-blue);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .social-btn:hover {
            transform: translateY(-2px);
            color: var(--theme-blue-dark);
        }

        .sidebar-nav .nav-link {
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            padding: 0.5rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .sidebar-nav .nav-link:hover,
        .sidebar-nav .nav-link.active {
            color: #ffffff;
        }

        .btn-touch {
            background-color: rgba(0, 0, 0, 0.25);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: 600;
            border-radius: 6px;
        }
        .btn-touch:hover {
            background-color: rgba(0, 0, 0, 0.35);
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row min-vh-100">
            <!-- Sidebar -->
            <aside class="col-12 col-md-4 col-xl-3 sidebar text-white text-center p-4 d-flex flex-column justify-content-between">
                <div>
                    <!-- Site / Author Name -->
                    <h2 class="fs-4 fw-bold mt-2 mb-4">
                        <a href="{{ '/' | relative_url }}" class="text-white text-decoration-none">{{ site.title }}</a>
                    </h2>

                    <!-- Avatar -->
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=240&q=80" 
                         alt="Author avatar" 
                         class="profile-img rounded-circle mb-3 shadow-sm">

                    <!-- Short Bio -->
                    <p class="small text-white-50 px-3 mb-2">
                        Hi, my name is Anthony Doe. Briefly introduce yourself here. You can also provide a link to the about page.
                    </p>
                    <a href="{{ '/about.html' | relative_url }}" class="small text-white text-decoration-underline d-block mb-3">Find out more about me</a>

                    <!-- Social Icons -->
                    <div class="d-flex justify-content-center gap-2 mb-4">
                        <a href="#" class="social-btn"><i class="bi bi-twitter-x"></i></a>
                        <a href="#" class="social-btn"><i class="bi bi-linkedin"></i></a>
                        <a href="#" class="social-btn"><i class="bi bi-github"></i></a>
                        <a href="#" class="social-btn"><i class="bi bi-stack-overflow"></i></a>
                        <a href="#" class="social-btn"><i class="bi bi-globe"></i></a>
                    </div>

                    <hr class="border-white-50 mb-4 opacity-25">

                    <!-- Navigation Links -->
                    <nav class="sidebar-nav nav flex-column mb-4">
                        <a class="nav-link {% if page.url == '/' %}active fw-bold{% endif %}" href="{{ '/' | relative_url }}">
                            <i class="bi bi-house-door"></i> Blog Home
                        </a>
                        <a class="nav-link" href="{{ '/' | relative_url }}">
                            <i class="bi bi-bookmark"></i> Blog Post
                        </a>
                        <a class="nav-link {% if page.url == '/about.html' %}active fw-bold{% endif %}" href="{{ '/about.html' | relative_url }}">
                            <i class="bi bi-person"></i> About Me
                        </a>
                    </nav>
                </div>

                <!-- CTA Button -->
                <div class="pb-3">
                    <a href="mailto:you@example.com" class="btn btn-touch w-75 py-2">Get in Touch</a>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="col-12 col-md-8 col-xl-9 p-4 p-md-5">
                {{ content }}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
