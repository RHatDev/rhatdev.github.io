<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <header class="py-4 mb-4 border-bottom">
            <h1 class="display-5 fw-bold">
                <a href="{{ '/' | relative_url }}" class="text-decoration-none text-body-emphasis">{{ site.title }}</a>
            </h1>
            <p class="fs-5 text-body-secondary mb-0">{{ site.description }}</p>
        </header>
        
        <main>
            {{ content }}
        </main>
    </div>

    <!-- Bootstrap 5 JS Bundle (Optional, for interactive components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
