<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <header class="py-4 mb-4 border-bottom d-flex flex-column flex-md-row align-items-md-center justify-content-between">
            <div>
                <h1 class="display-6 fw-bold mb-0">
                    <a href="{{ '/' | relative_url }}" class="text-decoration-none text-body-emphasis">{{ site.title }}</a>
                </h1>
                <p class="text-body-secondary mb-0 mt-1">{{ site.description }}</p>
            </div>
            
            <nav class="nav mt-3 mt-md-0 fs-5">
                <a class="nav-link px-2 {% if page.url == '/' %}text-primary fw-bold{% else %}text-body-secondary{% endif %}" href="{{ '/' | relative_url }}">Home</a>
                <a class="nav-link px-2 {% if page.url == '/about.html' %}text-primary fw-bold{% else %}text-body-secondary{% endif %}" href="{{ '/about.html' | relative_url }}">About</a>
            </nav>
        </header>
        
        <main>
            {{ content }}
        </main>
    </div>
</body>
</html>
