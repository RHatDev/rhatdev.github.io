---
layout: default
title: Home
---

<h2 class="mb-4 fs-3">Recent Posts</h2>

<div class="list-group list-group-flush border-top border-bottom">
  {% for post in site.posts %}
    <a href="{{ post.url | relative_url }}" class="list-group-item list-group-item-action py-3 px-0 border-0 border-bottom">
      <div class="d-flex w-100 justify-content-between align-items-center">
        <h5 class="mb-1 fw-semibold text-primary">{{ post.title }}</h5>
        <small class="text-body-secondary">{{ post.date | date: "%B %d, %Y" }}</small>
      </div>
    </a>
  {% endfor %}
</div>
